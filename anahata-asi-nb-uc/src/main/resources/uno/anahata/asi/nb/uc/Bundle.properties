\
    <div style="margin: 20px 0; padding: 15px; background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 6px; text-align: left;">\
        <h4 style="margin-top: 0; color: #2d3748; font-size: 15px; text-transform: uppercase; letter-spacing: 1px;"><span style="color: #004d98;">\u25c6</span> Key Features</h4>\
        <ul style="color: #4a5568; font-size: 12px; margin: 0; padding-left: 20px;">\
            <li><b>Zero Version Lock-in:</b> Relies exclusively on public OpenIDE APIs. Survives NetBeans upgrades without breakage.</li>\
            <li><b>Dynamic Catalog Routing:</b> Automatically resolves the exact update catalog for your active NetBeans major release.</li>\
            <li><b>1-Click Installation:</b> Seamlessly downloads, validates, and installs Anahata ASI Studio from within the IDE.</li>\
            <li><b>JavaFX Activation:</b> Verifies host JDK JavaFX runtime support and activates the NetBeans JavaFX kit when needed.</li>\
            <li><b>Legacy Center Cleanup:</b> Detects and removes obsolete update centers from previous NetBeans versions.</li>\
        </ul>\
