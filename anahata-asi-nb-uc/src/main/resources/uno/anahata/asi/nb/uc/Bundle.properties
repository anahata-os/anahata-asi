    <div style="margin-bottom: 20px; padding: 14px; background: #f0f4f8; border: 1px solid rgba(237, 187, 0, 0.3); border-left: 5px solid #edbb00; border-radius: 6px; text-align: left;">\
        <h3 style="margin-top: 0; color: #004d98; font-size: 14px; margin-bottom: 8px;">Anahata ASI Update Center: Universal Cross-Version NetBeans Installer</h3>\
        <p style="font-size: 11px; margin-bottom: 0; color: #4a5568;">\
            A lightweight, standalone NetBeans Platform module with zero implementation locks. Provides automated NetBeans version detection, dynamic Anahata ASI Update Center catalog registration (Universal, Stable, and Dev Snapshots), and 1-click installation of Anahata ASI Studio and JavaFX runtimes across all NetBeans versions (NB 21 &ndash; NB 35+).\
        </p>\
