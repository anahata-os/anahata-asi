name: Build & Deploy Platform, Artifacts & Website

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_nb_300:
        description: 'Release NetBeans 30 ASI Studio (Target 300 NBM)'
        required: false
        type: boolean
        default: true
      release_nb_310:
        description: 'Release NetBeans 31 ASI Studio (Target 310 NBM)'
        required: false
        type: boolean
        default: true
      release_nb_uc:
        description: 'Release NetBeans Update Center Plugin (anahata-asi-nb-uc)'
        required: false
        type: boolean
        default: false
      release_desktop:
        description: 'Release ASI Desktop Installers (Win/Mac/Linux)'
        required: false
        type: boolean
        default: true
      release_intellij:
        description: 'Release IntelliJ IDEA Plugin (.zip)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-core:
    name: Build & Deploy Core JARs & Parent POM
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25 & Maven
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: sonatype-central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Deploy Core Platform & Application JARs to Central
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "[INFO] Building and deploying all core JAR modules and parent POM (excluding NBMs)..."
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "[INFO] Release tag detected. Deploying core JARs to Sonatype Central Release portal..."
            mvn deploy -DskipTests -P release -pl !:anahata-asi-nb -ntp
          else
            echo "[INFO] Main branch detected. Deploying core snapshot JARs to Sonatype Snapshot repository..."
            mvn deploy -DskipTests -pl !:anahata-asi-nb -ntp \
              -DaltSnapshotDeploymentRepository=sonatype-central::https://central.sonatype.com/repository/maven-snapshots/
          fi

      - name: Upload IntelliJ Plugin Artifact
        if: github.event_name != 'workflow_dispatch' || inputs.release_intellij != false
        uses: actions/upload-artifact@v4
        with:
          name: intellij-plugin
          path: anahata-asi-intellij/target/*.zip

  build-nbm:
    name: Build & Publish NBM (${{ matrix.nb_target }})
    needs: [build-core]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - nb_target: "300"
            flag_name: "release_nb_300"
          - nb_target: "310"
            flag_name: "release_nb_310"
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check if NetBeans ${{ matrix.nb_target }} is Enabled
        id: check_enabled
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENABLED="${{ inputs[matrix.flag_name] }}"
            if [ "$ENABLED" == "false" ]; then
              echo "[INFO] Skipping NetBeans ${{ matrix.nb_target }} build (disabled in workflow_dispatch inputs)."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Checkout Code
        if: steps.check_enabled.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up JDK 25 & Maven
        if: steps.check_enabled.outputs.skip != 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: sonatype-central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Build & Deploy NBM
        if: steps.check_enabled.outputs.skip != 'true'
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # 1. Read current project version (e.g. 1.1.0-SNAPSHOT or 1.1.0)
          BASE_VER=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)

          # 2. Compute stamped version (e.g. 1.1.0.300-SNAPSHOT or 1.1.0.300)
          if [[ "$BASE_VER" == *"-SNAPSHOT" ]]; then
            BASE_NUM="${BASE_VER%-SNAPSHOT}"
            STAMPED_VER="${BASE_NUM}.${{ matrix.nb_target }}-SNAPSHOT"
          else
            STAMPED_VER="${BASE_VER}.${{ matrix.nb_target }}"
          fi

          echo "[INFO] Stamping NBM module version to: $STAMPED_VER on runner..."
          mvn versions:set -DnewVersion=$STAMPED_VER -DgenerateBackupPoms=false -pl :anahata-asi-nb -ntp

          echo "[INFO] Compiling local dependencies for NetBeans API RELEASE${{ matrix.nb_target }}..."
          mvn clean install -DskipTests -pl :anahata-asi-nb -am -ntp -Dnetbeans.version=RELEASE${{ matrix.nb_target }}

          echo "[INFO] Deploying ONLY the stamped NBM module ($STAMPED_VER) to Central..."
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            mvn deploy -DskipTests -P release -pl :anahata-asi-nb -ntp -Dnetbeans.version=RELEASE${{ matrix.nb_target }}
          else
            mvn deploy -DskipTests -pl :anahata-asi-nb -ntp -Dnetbeans.version=RELEASE${{ matrix.nb_target }} \
              -DaltSnapshotDeploymentRepository=sonatype-central::https://central.sonatype.com/repository/maven-snapshots/
          fi

          echo "[INFO] Generating Autoupdate catalog for NetBeans ${{ matrix.nb_target }}..."
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            mvn nbm:autoupdate -pl :anahata-asi-nb -Dnetbeans.version=RELEASE${{ matrix.nb_target }} -Dnbm.distBase=https://repo1.maven.org/maven2/uno/anahata/anahata-asi-nb/${STAMPED_VER} -ntp
          else
            mvn nbm:autoupdate -pl :anahata-asi-nb -Dnetbeans.version=RELEASE${{ matrix.nb_target }} -Dnbm.distBase=https://github.com/anahata-os/anahata-asi/releases/download/latest-snapshot -ntp
          fi

          # Fail-Fast: Verify catalog was produced
          if [ ! -f "anahata-asi-nb/target/netbeans_site/updates.xml" ]; then
            echo "[FATAL ERROR] target/netbeans_site/updates.xml was not generated for NetBeans ${{ matrix.nb_target }}!"
            exit 1
          fi

      - name: Upload NBM Artifact & Catalog
        if: steps.check_enabled.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nbm-artifact-${{ matrix.nb_target }}
          path: |
            anahata-asi-nb/target/*.nbm
            anahata-asi-nb/target/netbeans_site/updates.xml

  build-nb-uc:
    name: Build & Publish Update Center Plugin (anahata-asi-nb-uc)
    needs: [build-core]
    if: github.event_name != 'workflow_dispatch' || inputs.release_nb_uc == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25 & Maven
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: sonatype-central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Build & Deploy Update Center Plugin NBM
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "[INFO] Building and deploying anahata-asi-nb-uc ($VERSION)..."
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            mvn deploy -DskipTests -P release -pl :anahata-asi-nb-uc -ntp
            mvn nbm:autoupdate -pl :anahata-asi-nb-uc -Dnbm.distBase=https://repo1.maven.org/maven2/uno/anahata/anahata-asi-nb-uc/${VERSION} -ntp
          else
            mvn deploy -DskipTests -pl :anahata-asi-nb-uc -ntp \
              -DaltSnapshotDeploymentRepository=sonatype-central::https://central.sonatype.com/repository/maven-snapshots/
            mvn nbm:autoupdate -pl :anahata-asi-nb-uc -Dnbm.distBase=https://github.com/anahata-os/anahata-asi/releases/download/latest-snapshot -ntp
          fi

      - name: Upload Update Center NBM Artifact & Catalog
        uses: actions/upload-artifact@v4
        with:
          name: nbm-artifact-uc
          path: |
            anahata-asi-nb-uc/target/*.nbm
            anahata-asi-nb-uc/target/netbeans_site/updates.xml

  build-desktop:
    name: Build Desktop on ${{ matrix.os }}
    if: github.event_name != 'workflow_dispatch' || inputs.release_desktop != false
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Get Project Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          # jpackage on macOS is strict: version must be 1-3 integers separated by dots.
          # Strip any -SNAPSHOT or other suffixes for the installer metadata.
          JPACKAGE_VERSION=$(echo $VERSION | sed 's/-.*//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "JPACKAGE_VERSION=$JPACKAGE_VERSION" >> $GITHUB_ENV

      - name: Build Project
        run: mvn clean install -DskipTests -pl :anahata-asi-desktop -am -ntp

      - name: Prepare jpackage Input
        shell: bash
        run: |
          mkdir -p package-input/lib
          # Copy the main executable jar to the root
          cp anahata-asi-desktop/target/anahata-asi-desktop-${{ env.VERSION }}.jar package-input/
          # Copy all runtime dependencies to the lib folder. 
          mvn -f anahata-asi-desktop/pom.xml dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=../package-input/lib
          
          # Copy assets for jpackage flags
          cp anahata-asi-desktop/src/main/resources/icon.* .
          cp anahata-asi-desktop/src/main/resources/splash.png package-input/

      - name: Set OS Specific Variables
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            echo "ICON_FILE=icon.icns" >> $GITHUB_ENV
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            echo "ICON_FILE=icon.ico" >> $GITHUB_ENV
          else
            echo "ICON_FILE=icon.png" >> $GITHUB_ENV
          fi

      - name: Package Native App (jpackage)
        shell: bash
        run: |
          jpackage --name "Anahata-ASI-Desktop" \
                   --app-version "${{ env.JPACKAGE_VERSION }}" \
                   --input package-input \
                   --main-jar "anahata-asi-desktop-${{ env.VERSION }}.jar" \
                   --main-class uno.anahata.asi.desktop.Main \
                   --icon "${{ env.ICON_FILE }}" \
                   --java-options "-splash:splash.png" \
                   --java-options "--enable-native-access=ALL-UNNAMED" \
                   --type app-image \
                   --dest dist \
                   --verbose
          
          # Zip/Tar the result for distribution
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            7z a "Anahata-ASI-Desktop-${{ env.VERSION }}-windows.zip" "./dist/Anahata-ASI-Desktop"
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            cd dist && zip -r "../Anahata-ASI-Desktop-${{ env.VERSION }}-macos.zip" "Anahata-ASI-Desktop.app" && cd ..
          else
            tar -czf "Anahata-ASI-Desktop-${{ env.VERSION }}-linux.tar.gz" -C dist "Anahata-ASI-Desktop"
          fi

      # =========================================================================
      # Ubuntu Snap Store / App Center Distribution (Placeholder)
      # To be enabled once Canonical Snapcraft store credentials are configured.
      # =========================================================================
      # - name: Publish to Ubuntu Snap Store (Linux only)
      #   if: matrix.os == 'ubuntu-latest' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
      #   uses: canonical/action-publish@v1
      #   with:
      #     store_token: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
      #     snap: anahata-asi-desktop_*.snap
      #     channel: stable

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.os }}
          path: |
            Anahata-ASI-Desktop-*.zip
            Anahata-ASI-Desktop-*.tar.gz

  release:
    name: Create & Publish Unified Release
    needs: [build-core, build-nbm, build-desktop]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Purge old snapshot assets
        if: github.ref == 'refs/heads/main'
        run: |
          # Fetch and delete all existing assets for the latest-snapshot release
          assets=$(gh release view latest-snapshot --json assets -q '.assets[].name' || true)
          for asset in $assets; do
            echo "Deleting stale snapshot asset: $asset"
            gh release delete-asset latest-snapshot "$asset" -y || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-snapshot' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Snapshot' }}
          body: |
            ${{ startsWith(github.ref, 'refs/tags/') && 'Official Stable GA Release' || '🚀 This is an automated rolling snapshot of the main branch. Use with caution!' }}
          files: |
            all-artifacts/*.nbm
            all-artifacts/Anahata-ASI-Desktop-*.zip
            all-artifacts/Anahata-ASI-Desktop-*.tar.gz
            all-artifacts/*.zip
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-website:
    name: Deploy Website, Javadocs & Update Centers
    needs: [build-core, build-nbm, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: sonatype-central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Build and Generate Aggregated Javadoc
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          mvn clean install javadoc:aggregate -DskipTests -ntp

      - name: Checkout gh-pages Branch (Persistence Database)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: temp-gh-pages

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Download NBM Artifacts & Catalogs
        uses: actions/download-artifact@v4
        with:
          pattern: 'nbm-artifact-*'
          path: downloaded-nbm-artifacts

      - name: Prepare Deployment Folder & Merge Javadocs & Catalogs
        run: |
          mkdir -p _site
          # 1. Copy the static website source
          cp -r anahata-asi-web/src/main/resources/web/* _site/
          
          # 2. Reconstruct historical Javadoc vault (only copy version directories starting with a digit)
          mkdir -p _site/apidocs
          if [ -d "temp-gh-pages/apidocs" ]; then
            for dir in temp-gh-pages/apidocs/*; do
              if [ -d "$dir" ]; then
                dirname=$(basename "$dir")
                if [[ "$dirname" =~ ^[0-9] ]]; then
                  cp -r "$dir" _site/apidocs/
                fi
              fi
            done
          fi
          
          # 3. Copy newly generated flat Javadocs
          if [ -d "docs/apidocs" ]; then
            cp -r docs/apidocs/* _site/apidocs/
          fi

          # 4. Inject CNAME for custom domain
          echo "asi.anahata.uno" > _site/CNAME

          # 5. Restore existing update catalogs from gh-pages branch so historical catalogs persist
          if [ -d "temp-gh-pages/nb" ]; then
            cp -r temp-gh-pages/nb _site/
          fi

          # 6. Dynamically discover and deploy NetBeans update catalogs from matrix build artifacts
          for artifact_dir in downloaded-nbm-artifacts/nbm-artifact-*; do
            if [ -d "$artifact_dir" ]; then
              TARGET="${artifact_dir##*artifact-}"
              if [ "$TARGET" == "uc" ]; then
                CATALOG_DIR="_site/nb"
              else
                MAJOR="${TARGET:0:2}"
                CATALOG_DIR="_site/nb/${MAJOR}"
              fi
              mkdir -p "$CATALOG_DIR"

              SOURCE_CATALOG=$(find "$artifact_dir" -name "updates.xml" | head -n 1)
              if [ -n "$SOURCE_CATALOG" ] && [ -f "$SOURCE_CATALOG" ]; then
                if [[ "${{ github.ref }}" == refs/tags/v* ]] || [ "$TARGET" == "uc" ]; then
                  CATALOG_FILE="$CATALOG_DIR/updates.xml"
                else
                  CATALOG_FILE="$CATALOG_DIR/dev-updates.xml"
                fi

                echo "[INFO] Copying catalog (Target: $TARGET) from $SOURCE_CATALOG to $CATALOG_FILE..."
                cp "$SOURCE_CATALOG" "$CATALOG_FILE" || exit 1
                gzip -9 -c "$CATALOG_FILE" > "${CATALOG_FILE}.gz" || true
              fi
            fi
          done

          # 7. Prune obsolete snapshots and dynamically regenerate apidocs/index.html with smart badges
          python3 -c '
          import os, re, shutil

          apidocs_dir = "_site/apidocs"
          all_dirs = [d for d in os.listdir(apidocs_dir) if os.path.isdir(os.path.join(apidocs_dir, d)) and not d.startswith(".") and d[0].isdigit()]

          # Separate stable releases from snapshots
          snapshots = [d for d in all_dirs if "SNAPSHOT" in d]
          stables = [d for d in all_dirs if "SNAPSHOT" not in d]

          # Helper to sort versions numerically
          def parse_ver(v_str):
              clean = re.sub(r"-SNAPSHOT.*", "", v_str)
              return [int(x) for x in re.findall(r"\d+", clean)]

          stables.sort(key=parse_ver, reverse=True)
          snapshots.sort(key=parse_ver, reverse=True)

          # Keep ONLY the latest active snapshot; prune all older snapshot directories
          active_snapshot = snapshots[0] if snapshots else None
          for stale_snap in snapshots[1:]:
              stale_path = os.path.join(apidocs_dir, stale_snap)
              print(f"[INFO] Pruning obsolete snapshot Javadoc directory: {stale_snap}")
              shutil.rmtree(stale_path, ignore_errors=True)

          final_versions = ([active_snapshot] if active_snapshot else []) + stables

          li_html = ""
          for v in final_versions:
              if "SNAPSHOT" in v:
                  badge = " <span class=\"badge\" style=\"background: var(--primary-light); color: white; font-weight: 800; padding: 2px 7px; border-radius: 4px; font-size: 0.72rem; margin-left: 8px;\">Dev Snapshot</span>"
              elif stables and v == stables[0]:
                  badge = " <span class=\"badge\" style=\"background: var(--barca-gold); color: black; font-weight: 800; padding: 2px 7px; border-radius: 4px; font-size: 0.72rem; margin-left: 8px;\">Latest Stable</span>"
              else:
                  badge = ""
              li_html += f"            <li class=\"version-item\"><a href=\"{v}/apidocs/index.html\" class=\"version-link\">{v}{badge}</a></li>\n"

          index_path = os.path.join(apidocs_dir, "index.html")
          with open(index_path, "r") as f:
              html = f.read()
          new_html = re.sub(r"<ul class=\"version-list\">.*?</ul>", f"<ul class=\"version-list\">\n{li_html}        </ul>", html, flags=re.DOTALL)
          with open(index_path, "w") as f:
              f.write(new_html)
          '

      - name: Persist New Javadocs & Update Catalogs back to gh-pages
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          cd temp-gh-pages
          rm -rf apidocs/*
          mkdir -p apidocs nb
          cp -r ../_site/apidocs/* apidocs/
          cp -r ../_site/nb/* nb/
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apidocs/ nb/
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist versioned Javadocs & update catalogs from run ${{ github.run_id }} 📚"
            git push origin gh-pages
          else
            echo "No new Javadoc or catalog changes to persist."
          fi

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
