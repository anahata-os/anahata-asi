name: 🚀 Release ASI Desktop (Cross-Platform Matrix)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_snap:
        description: 'Publish Linux Snap to Ubuntu Snap Store'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish_snap:
        description: 'Publish Linux Snap to Ubuntu Snap Store'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # 1. LINUX NATIVE APP BUILDER & UBUNTU SNAP STORE
  # =========================================================================
  build-linux:
    name: Build Desktop (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile Desktop Module
        run: mvn clean install -DskipTests -pl :anahata-asi-desktop -am -ntp

      - name: Package Linux Native App Image (jpackage)
        shell: bash
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          JPACKAGE_VERSION=$(echo $VERSION | sed 's/-.*//')

          mkdir -p package-input/lib
          cp anahata-asi-desktop/target/anahata-asi-desktop-${VERSION}.jar package-input/
          mvn -f anahata-asi-desktop/pom.xml dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=../package-input/lib
          cp anahata-asi-desktop/src/main/resources/icon.png .
          cp anahata-asi-desktop/src/main/resources/splash.png package-input/

          jpackage --name "Anahata-ASI-Desktop" \
                   --app-version "$JPACKAGE_VERSION" \
                   --input package-input \
                   --main-jar "anahata-asi-desktop-${VERSION}.jar" \
                   --main-class uno.anahata.asi.desktop.Main \
                   --icon "icon.png" \
                   --java-options "-splash:splash.png" \
                   --java-options "--enable-native-access=ALL-UNNAMED" \
                   --type app-image \
                   --dest dist \
                   --verbose

          mkdir -p staging-desktop
          tar -czf "staging-desktop/Anahata-ASI-Desktop-${VERSION}-linux.tar.gz" -C dist "Anahata-ASI-Desktop"

      # ---------------------------------------------------------------------
      # CANONICAL SNAP STORE PUBLISHER (Ubuntu App Center)
      # ---------------------------------------------------------------------
      - name: Install Snapcraft
        if: inputs.publish_snap == true || startsWith(github.ref, 'refs/tags/v')
        run: sudo snap install snapcraft --classic

      - name: Build Snap Package
        if: inputs.publish_snap == true || startsWith(github.ref, 'refs/tags/v')
        run: snapcraft --destructive-mode

      - name: Publish to Ubuntu Snap Store (Snapcraft)
        if: inputs.publish_snap == true || startsWith(github.ref, 'refs/tags/v')
        uses: canonical/action-publish@v1
        with:
          store_token: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          snap: anahata-asi-desktop_*.snap
          channel: stable

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: staging-desktop/*.tar.gz

  # =========================================================================
  # 2. WINDOWS NATIVE APP BUILDER (.zip with jpackage)
  # =========================================================================
  build-windows:
    name: Build Desktop (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Package Windows Native App Image
        shell: bash
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          JPACKAGE_VERSION=$(echo $VERSION | sed 's/-.*//')
          mvn clean install -DskipTests -pl :anahata-asi-desktop -am -ntp

          mkdir -p package-input/lib
          cp anahata-asi-desktop/target/anahata-asi-desktop-${VERSION}.jar package-input/
          mvn -f anahata-asi-desktop/pom.xml dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=../package-input/lib
          cp anahata-asi-desktop/src/main/resources/icon.ico .
          cp anahata-asi-desktop/src/main/resources/splash.png package-input/

          jpackage --name "Anahata-ASI-Desktop" \
                   --app-version "$JPACKAGE_VERSION" \
                   --input package-input \
                   --main-jar "anahata-asi-desktop-${VERSION}.jar" \
                   --main-class uno.anahata.asi.desktop.Main \
                   --icon "icon.ico" \
                   --java-options "-splash:splash.png" \
                   --java-options "--enable-native-access=ALL-UNNAMED" \
                   --type app-image \
                   --dest dist \
                   --verbose

          mkdir -p staging-desktop
          7z a "staging-desktop/Anahata-ASI-Desktop-${VERSION}-windows.zip" "./dist/Anahata-ASI-Desktop"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: staging-desktop/*.zip

  # =========================================================================
  # 3. MACOS APP BUNDLE BUILDER (.zip with jpackage)
  # =========================================================================
  build-macos:
    name: Build Desktop (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Package macOS App Bundle
        shell: bash
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          JPACKAGE_VERSION=$(echo $VERSION | sed 's/-.*//')
          mvn clean install -DskipTests -pl :anahata-asi-desktop -am -ntp

          mkdir -p package-input/lib
          cp anahata-asi-desktop/target/anahata-asi-desktop-${VERSION}.jar package-input/
          mvn -f anahata-asi-desktop/pom.xml dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=../package-input/lib
          cp anahata-asi-desktop/src/main/resources/icon.icns .
          cp anahata-asi-desktop/src/main/resources/splash.png package-input/

          jpackage --name "Anahata-ASI-Desktop" \
                   --app-version "$JPACKAGE_VERSION" \
                   --input package-input \
                   --main-jar "anahata-asi-desktop-${VERSION}.jar" \
                   --main-class uno.anahata.asi.desktop.Main \
                   --icon "icon.icns" \
                   --java-options "-splash:splash.png" \
                   --java-options "--enable-native-access=ALL-UNNAMED" \
                   --type app-image \
                   --dest dist \
                   --verbose

          mkdir -p staging-desktop
          cd dist && zip -r "../staging-desktop/Anahata-ASI-Desktop-${VERSION}-macos.zip" "Anahata-ASI-Desktop.app" && cd ..

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: staging-desktop/*.zip

  # =========================================================================
  # 4. PUBLISH DESKTOP BINARIES TO GITHUB RELEASE
  # =========================================================================
  publish-desktop-release:
    name: Publish Desktop Binaries
    needs: [build-linux, build-windows, build-macos]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Desktop Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-desktop-binaries
          merge-multiple: true

      - name: Attach Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-snapshot' }}
          files: |
            all-desktop-binaries/Anahata-ASI-Desktop-*-linux.tar.gz
            all-desktop-binaries/Anahata-ASI-Desktop-*-windows.zip
            all-desktop-binaries/Anahata-ASI-Desktop-*-macos.zip
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
